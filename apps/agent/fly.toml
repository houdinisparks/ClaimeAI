# fly.toml app configuration file generated for claime-agent-api on 2025-11-22T12:40:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'claime-agent-api'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile.fastapi'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
